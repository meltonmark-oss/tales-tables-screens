<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233027">
  <meta name="description" content="Browse the Melton collection of books, movies, TV, and tabletop games.">
  <title>Tales, Tables &amp; Screens</title>
  <link rel="stylesheet" href="collection.css?v=42">
  <script src="catalog-data.js?v=41" defer></script>
  <script src="catalog-details.js?v=41" defer></script>
  <script src="catalog.js?v=42" defer></script>
  <script src="movie-art-v29.js?v=35" defer></script>
  <script src="game-night-v24.js?v=41" defer></script>
  <script src="scanner-v26.js?v=28" defer></script>
</head>
<body data-tab="books">
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <symbol id="icon-shelves" viewBox="0 0 24 24"><path d="M3 19h18M5 6h4v13H5zM9 8h4v11H9zM15 6l4-1 3 13-4 1z"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-10-1v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1v14"/></symbol>
    <symbol id="icon-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></symbol>
    <symbol id="icon-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h.01M12 12h.01M16 16h.01" stroke-width="2.6"/></symbol>
    <symbol id="icon-kids" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.2.9-4.5 4.3 1.1 6.2-5.5-2.9L6.5 20l1.1-6.2-4.5-4.3 6.2-.9L12 3Z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16M9 5v4m6 1v4m-6 1v4"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-tools" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-scan" viewBox="0 0 24 24"><path d="M4 8V5h3m10 0h3v3m0 8v3h-3M7 19H4v-3M7 9v6m3-6v6m4-6v6m3-6v6"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <a class="skip-link" href="#collection">Skip to collection</a>
  <div class="masthead">
    <header class="brand-bar">
      <div class="shell brand-inner">
        <div class="brand">
          <span class="brand-symbol"><svg class="icon"><use href="#icon-shelves"/></svg></span>
          <h1>Tales, Tables &amp; Screens</h1>
        </div>
        <div class="header-actions">
          <details class="utility-drawer" id="toolsMenu">
            <summary class="button quiet" aria-label="Collection tools"><svg class="icon"><use href="#icon-tools"/></svg><span>Tools</span></summary>
            <div class="utility-actions">
              <button type="button" id="backup">Download backup</button>
              <button type="button" id="restore">Restore from backup</button>
              <button type="button" id="cleanMovieTitles">Fix DVD titles</button>
              <button type="button" id="undoMovieTitles" hidden>Undo title fixes</button>
              <input type="file" accept=".json,application/json" id="restoreFile" hidden>
              <p>Collection edits are saved in this browser.</p>
            </div>
          </details>
          <button type="button" id="add" class="button primary"><svg class="icon"><use href="#icon-plus"/></svg>Add<span class="add-long"> item</span></button>
        </div>
      </div>
    </header>
    <nav class="section-nav" aria-label="Collection sections">
      <div class="shell section-links">
        <button type="button" data-go="books" aria-current="page"><svg class="icon"><use href="#icon-book"/></svg>Books</button>
        <button type="button" data-go="movies"><svg class="icon"><use href="#icon-film"/></svg>Movies &amp; TV</button>
        <button type="button" data-go="games"><svg class="icon"><use href="#icon-dice"/></svg>Games</button>
        <button type="button" data-go="kids"><svg class="icon"><use href="#icon-kids"/></svg>Kids’ Books</button>
      </div>
    </nav>
  </div>

  <main class="shell" id="collection">
    <section class="room" aria-labelledby="heading">
      <img id="roomArt" class="room-art" src="art/books.svg" alt="" fetchpriority="high">
      <div class="room-text">
        <h2 id="heading">Great Library</h2>
        <p id="roomCount"></p>
      </div>
    </section>

    <section class="browse-tools" aria-label="Browse the collection">
      <div class="toolbar">
        <div class="search-controls">
          <label class="search-box">
            <svg class="icon"><use href="#icon-search"/></svg>
            <input id="search" type="search" placeholder="Search books" aria-label="Search books" autocomplete="off">
          </label>
          <button type="button" id="filterToggle" class="button secondary" aria-expanded="false" aria-controls="filterFields">
            <svg class="icon"><use href="#icon-filter"/></svg><span id="filterLabel">Filters</span>
          </button>
        </div>
        <div class="browse-actions">
          <button type="button" id="scan" class="button secondary"><svg class="icon"><use href="#icon-scan"/></svg>Scan barcode</button>
          <button type="button" id="random" class="button secondary"><svg class="icon"><use href="#icon-dice"/></svg>Surprise me</button>
        </div>
      </div>
      <div class="filter-fields" id="filterFields" hidden>
        <label>Genre <select id="genre"><option value="">All genres</option></select></label>
        <label class="book-filter">Author <select id="authorFilter"><option value="">All authors</option></select></label>
        <label class="book-filter">Length
          <select id="pagesFilter">
            <option value="">Any length</option><option value="0-199">Under 200 pages</option><option value="200-399">200–399 pages</option>
            <option value="400-599">400–599 pages</option><option value="600-99999">600+ pages</option><option value="unknown">Pages unknown</option>
          </select>
        </label>
        <label class="book-filter">Publication year <input id="yearFilter" type="number" min="1400" max="2100" inputmode="numeric" placeholder="Any year"></label>
        <label>Availability
          <select id="status"><option value="">All statuses</option><option value="available">Available</option><option value="out">Lent out</option></select>
        </label>
        <label>Sort
          <select id="sort"><option value="az">Title A–Z</option><option value="za">Title Z–A</option></select>
        </label>
        <button type="button" id="clearFilters" class="button secondary">Clear filters</button>
      </div>
    </section>

    <details id="gameNight" class="game-night" hidden>
      <summary><svg class="icon"><use href="#icon-dice"/></svg><span id="gnTitle">Game Night Builder</span></summary>
      <div class="gn-body">
        <div class="gn-controls">
          <label for="gnPlayers">Players
            <select id="gnPlayers">
              <option value="1">1 player</option><option value="2">2 players</option><option value="3">3 players</option>
              <option value="4" selected>4 players</option><option value="5">5 players</option><option value="6">6 players</option>
              <option value="7">7 players</option><option value="8">8 players</option><option value="9">9 players</option>
              <option value="10">10 players</option><option value="11">11 players</option><option value="12">12 players</option>
            </select>
          </label>
          <label for="gnTime">Time available
            <select id="gnTime">
              <option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option>
              <option value="90" selected>1½ hours</option><option value="120">2 hours</option><option value="150">2½ hours</option>
              <option value="180">3 hours</option><option value="240">4 hours</option>
            </select>
          </label>
          <label for="gnMood">Game style
            <select id="gnMood">
              <option value="any">Any style</option><option value="cooperative">Cooperative</option><option value="competitive">Competitive</option>
              <option value="party">Party</option><option value="family">Family</option>
            </select>
          </label>
          <button id="gnBuild" class="button primary" type="button">Build game night</button>
        </div>
        <p class="gn-note" id="gnCoverage"></p>
        <div id="gnResults" class="gn-results" aria-live="polite"></div>
      </div>
    </details>

    <div class="results-bar">
      <p id="summary" aria-live="polite"></p>
      <div class="view-controls" role="group" aria-label="Collection view">
        <button type="button" class="button" data-view="grid" aria-label="Grid view" title="Grid view" aria-pressed="true"><svg class="icon"><use href="#icon-grid"/></svg></button>
        <button type="button" class="button" data-view="list" aria-label="List view" title="List view" aria-pressed="false"><svg class="icon"><use href="#icon-list"/></svg></button>
      </div>
    </div>
    <div class="shelf" data-view="grid">
      <div id="cards" class="cards"></div>
    </div>
    <footer><a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Book cover data from Open Library</a></footer>
  </main>

  <dialog class="modal detail-dialog" id="detailModal" aria-labelledby="detailTitle">
    <div class="panel">
      <button type="button" id="closeDetail" class="button icon-button close-button" aria-label="Close details" autofocus><svg class="icon"><use href="#icon-close"/></svg></button>
      <div id="detailContent"></div>
      <div class="dialog-actions">
        <button type="button" class="button primary" id="detailEdit">Edit item</button>
        <button type="button" class="button secondary" id="detailEdition"><svg class="icon"><use href="#icon-scan"/></svg>Compare ISBN edition</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal edit-dialog" id="modal" aria-labelledby="editTitle">
    <div class="panel">
      <div class="editor-header">
        <div class="dialog-heading">
          <h2 id="editTitle">Edit item</h2>
          <button type="button" id="closeEdit" class="button icon-button" aria-label="Close editor" autofocus><svg class="icon"><use href="#icon-close"/></svg></button>
        </div>
        <div class="editor-actions">
          <button id="save" type="submit" form="itemForm" class="button primary">Save item</button>
          <button id="cancel" type="button" class="button secondary">Cancel</button>
          <button id="delete" type="button" class="button danger" aria-label="Delete item">Delete</button>
        </div>
      </div>
      <form id="itemForm">
        <div class="fields">
          <label class="full-field">Title <input id="fTitle" required></label>
          <label>Category <select id="fType"><option value="Book">Book</option><option value="Movie">Movie &amp; TV</option><option value="Game">Board game</option></select></label>
          <label>Status <select id="fStatus"><option value="Available">Available</option><option value="Lent Out">Lent out</option></select></label>
          <label>Genre <input id="fGenre"></label>
          <label class="book-field">Author <input id="fAuthor"></label>
          <label class="check-label book-field full-field"><input id="fKids" type="checkbox"> Children’s book</label>
          <label class="full-field" id="descriptionField">Description <textarea id="fDescription" rows="3"></textarea></label>
          <label>Format or edition <input id="fFormat"></label>
          <label>Year <input id="fYear" type="number" min="1400" max="2100" inputmode="numeric"></label>
          <label class="book-field">Page count <input id="fPages" type="number" min="1" inputmode="numeric"></label>
          <label class="book-field">Publisher <input id="fPublisher"></label>
          <div class="game-field full-field" hidden>
            <label>Minimum players <input id="fMinPlayers" type="number" inputmode="numeric" min="1" max="50"></label>
            <label>Maximum players <input id="fMaxPlayers" type="number" inputmode="numeric" min="1" max="50"></label>
            <label>Play time in minutes <input id="fPlayMinutes" type="number" inputmode="numeric" min="1" max="600"></label>
            <label>Game night style <select id="fGameMood"><option value="">Not set</option><option value="cooperative">Cooperative</option><option value="competitive">Competitive</option><option value="party">Party</option><option value="family">Family</option></select></label>
          </div>
          <div class="full-field field-group">
            <label>Barcode <input id="fBarcode" inputmode="numeric" placeholder="ISBN or UPC"></label>
            <button type="button" id="scanThisBarcode" class="button secondary"><svg class="icon"><use href="#icon-scan"/></svg>Scan into this item</button>
          </div>
          <details class="book-field full-field edition-tools" id="editionTools">
            <summary id="editionSummary">ISBN edition lookup</summary>
            <div class="edition-body">
              <label>Edition ISBN <input id="editionISBN" autocomplete="off" placeholder="10- or 13-digit ISBN"></label>
              <div class="button-row">
                <button id="lookupBook" type="button" class="button primary">Compare ISBN</button>
                <button id="scanEdition" type="button" class="button secondary">Scan ISBN</button>
              </div>
              <div id="editionPreview" aria-live="polite"></div>
            </div>
          </details>
          <p id="lookupStatus" class="field-message full-field" role="status"></p>
          <div class="full-field field-group">
            <label>Cover image URL <input id="fCover" inputmode="url" placeholder="https://…"></label>
            <button id="findCover" type="button" class="button secondary">Find matching artwork</button>
            <div id="coverSuggestion" class="field-message" role="status"></div>
          </div>
        </div>
      </form>
    </div>
  </dialog>

  <dialog class="modal scan-dialog" id="scanModal" aria-labelledby="scanTitle">
    <div class="panel">
      <div class="dialog-heading">
        <h2 id="scanTitle">Scan a barcode</h2>
        <button id="scanClose" type="button" class="button icon-button" aria-label="Close scanner" autofocus><svg class="icon"><use href="#icon-close"/></svg></button>
      </div>
      <video id="scanVideo" autoplay muted playsinline hidden></video>
      <div class="scanner-actions button-row">
        <button id="cameraStart" class="button secondary" type="button">Start camera</button>
        <button id="scanPhoto" class="button secondary" type="button">Scan from photo</button>
      </div>
      <input id="barcodePhoto" type="file" accept="image/*" capture="environment" hidden>
      <p id="scanStatus" class="field-message" role="status"></p>
      <label for="scanCode">Barcode number</label>
      <div class="code-row">
        <input id="scanCode" inputmode="numeric" autocomplete="off" placeholder="ISBN or UPC">
        <button id="scanLookup" class="button primary" type="button">Look up</button>
        <button id="scanApplyToItem" class="button primary" type="button" hidden>Use this barcode</button>
      </div>
      <div id="scanResult" aria-live="polite"></div>
    </div>
  </dialog>
</body>
</html>
